<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        const appearance = JSON.parse(localStorage.getItem('firekb.appearance.v1') || '{}');
        const mode = ['light', 'dark', 'system'].includes(appearance.mode) ? appearance.mode : 'light';
        document.documentElement.dataset.theme = mode === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : mode;
        document.documentElement.dataset.accent = ['blue', 'green', 'sand', 'graphite'].includes(appearance.accent) ? appearance.accent : 'blue';
      } catch {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FireKB Desktop</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
